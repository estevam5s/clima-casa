<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Clima Escritório · bloqueado</title>
<style>
  :root { color-scheme: light dark; --f:#f6f6f7; --t:#0e0e11; --s:#6b6b74; --p:#0f766a; }
  @media (prefers-color-scheme: dark) { :root { --f:#0e0e10; --t:#f2f2f3; --s:#9b9ba3; --p:#26a69a; } }
  body { margin:0; height:100vh; display:grid; place-items:center; background:var(--f); color:var(--t); font:15px -apple-system, "Segoe UI", sans-serif; -webkit-app-region: drag; }
  main { text-align:center; max-width:340px; padding:24px; }
  h1 { font-size:20px; margin:16px 0 6px; } p { color:var(--s); margin:0 0 20px; line-height:1.5; }
  button { -webkit-app-region: no-drag; background:var(--p); color:#fff; border:0; border-radius:10px; padding:11px 20px; font:600 14px inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <svg width="52" height="52" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0f766a"/><path d="M16 6v20M7.3 11l17.4 10M7.3 21l17.4-10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  <h1>App bloqueado</h1>
  <p id="m">Use o Touch ID para abrir o Clima Escritório.</p>
  <button id="b">Desbloquear com Touch ID</button>
</main>
<script>const b = document.getElementById('b'), m = document.getElementById('m')
async function tentar() { b.disabled = true; const r = await window.climaDesktop.desbloquear(); b.disabled = false; if (!r.ok) m.textContent = r.erro || 'Não foi possível confirmar. Tente de novo.' }
b.onclick = tentar; setTimeout(tentar, 300)</script>
</body>
</html>
