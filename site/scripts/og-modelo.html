<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700;800&family=Roboto:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0e0f11; font-family: Roboto, sans-serif; }
  .tela { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .mancha { position: absolute; border-radius: 50%; }
  .m1 { width: 560px; height: 560px; left: -220px; top: -260px; background: rgba(156,254,79,.55); filter: blur(140px); }
  .m2 { width: 520px; height: 520px; right: -200px; top: -220px; background: #8778f5; filter: blur(130px); opacity: .85; }
  .m3 { width: 420px; height: 420px; left: 240px; bottom: -320px; background: rgba(156,254,79,.35); filter: blur(140px); }
  .grade { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(90deg, black 0%, transparent 70%); }
  .esq { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 600px; display: flex; flex-direction: column; }
  .marca { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; padding: 5px; border-radius: 40px; border: 1px solid #313131; }
  .marca span { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 9px; border-radius: 40px; background: #0e0f11; color: #fff; font: 700 24px 'Source Sans 3'; }
  .marca svg { width: 34px; height: 34px; }
  .tag { margin-top: 44px; align-self: flex-start; border: 1.5px solid #9cfe4f; color: #fff; border-radius: 30px; padding: 7px 18px; font: 500 19px Roboto; }
  h1 { margin-top: 20px; color: #fff; font: 800 62px/1.04 'Source Sans 3'; letter-spacing: -.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  h1.longo { font-size: 52px; }
  p.desc { margin-top: 20px; color: #a8a9aa; font: 400 23px/1.45 Roboto; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rodape { margin-top: auto; display: flex; align-items: center; gap: 18px; }
  .dominio { background: #9cfe4f; color: #1a1a1a; border-radius: 30px; padding: 9px 20px; font: 700 21px 'Source Sans 3'; }
  .itens { color: #d4d4d4; font: 500 18px Roboto; }
  .dir { position: absolute; left: 690px; top: 92px; width: 620px; }
  .moldura { border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 8px rgba(255,255,255,.03); transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); transform-origin: left center; }
  .moldura .barra { height: 30px; background: #1b1c1f; display: flex; align-items: center; gap: 7px; padding-left: 12px; }
  .moldura .barra i { width: 10px; height: 10px; border-radius: 50%; background: #3a3b3f; display: block; }
  .moldura img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: left top; }
  .espiral { position: absolute; right: 36px; bottom: 34px; width: 110px; height: 110px; opacity: .55; }
</style></head>
<body><div class="tela">
  <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div><div class="grade"></div>
  <div class="esq">
    <div class="marca"><span><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0f766a"/><path d="M16 6v20M7.3 11l17.4 10M7.3 21l17.4-10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>Clima Escritório</span></div>
    <div class="tag" id="tag"></div>
    <h1 id="titulo"></h1>
    <p class="desc" id="desc"></p>
    <div class="rodape"><span class="dominio" id="dominio">zynio.com.br</span><span class="itens" id="itens">Infravermelho · Alexa · Agenda · Relatórios</span></div>
  </div>
  <div class="dir"><div class="moldura"><div class="barra"><i></i><i></i><i></i></div><img id="tela" alt=""></div></div>
  <svg class="espiral" id="espiral" viewBox="0 0 200 200"></svg>
</div>
<script>
  // espiral do site (mesmo desenho do componente Espiral)
  const R = 100, n = 18, larg = Math.PI / n; let html = ''
  for (let k = 0; k < n; k++) { const a0 = k * 2 * Math.PI / n, ida = [], volta = []
    for (let i = 0; i <= 24; i++) { const r = i / 24 * R, t = 2.6 * r / R; ida.push([R + r * Math.cos(a0 + t), R + r * Math.sin(a0 + t)]); volta.push([R + r * Math.cos(a0 + t + larg), R + r * Math.sin(a0 + t + larg)]) }
    html += `<path d="${[...ida, ...volta.reverse()].map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ')} Z" fill="rgba(140,130,200,.8)"/>` }
  document.getElementById('espiral').innerHTML = html
  window.preencher = ({ tag, titulo, desc, img, itens, dominio }) => {
    document.getElementById('dominio').textContent = dominio || 'zynio.com.br'
    document.getElementById('tag').textContent = tag
    document.getElementById('titulo').textContent = titulo
    document.getElementById('desc').textContent = desc
    document.getElementById('itens').textContent = itens || 'Infravermelho · Alexa · Agenda · Relatórios'
    const h1 = document.getElementById('titulo'); h1.classList.toggle('longo', titulo.length > 48)
    return new Promise((ok) => { const i = document.getElementById('tela'); i.onload = ok; i.onerror = ok; i.src = img })
  }
</script></body></html>
